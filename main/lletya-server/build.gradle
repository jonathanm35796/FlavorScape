version = '1.0.0.1'
project.ext {
    type = "server"
}

apply plugin: 'application'
apply plugin: 'kotlin'

compileKotlin {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation project(':lletya-api')
    implementation("org.mindrot:jbcrypt:0.4")
    implementation group: 'com.typesafe', name: 'config', version:'1.3.1'
    implementation group: 'net.dv8tion', name: 'JDA', version: '5.5.1'
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.15.3'
    implementation group: 'io.undertow', name: 'undertow-core', version: '2.3.21.Final'
    implementation 'com.mashape.unirest:unirest-java:1.4.9'
    //compile group: 'de.brudaswen.kotlinx.coroutines', name: 'kotlinx-coroutines-swt', version: '1.0.0'
    implementation group: 'org.jetbrains.kotlinx', name: 'kotlinx-coroutines-core', version: '1.3.7'
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version:'2.1.21'
    implementation group: 'com.ea.agentloader', name: 'ea-agent-loader', version: '1.0.3'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-yaml
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: '2.11.0'

}

application {
    mainClassName = 'io.ruin.Server'
}

application {
    mainClassName = 'io.ruin.Server'
    applicationDefaultJvmArgs = [
            "--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED"
    ]
}

compileJava {
    options.compilerArgs.addAll([
            '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
    ])
}

// Parse the active Java switch cases at build time so aliases/comments cannot drift from help.
def catalogTool = tasks.register('compileCommandCatalogGenerator', JavaCompile) {
    source = fileTree('src/commandCatalog/java') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('commandCatalogGenerator')
    options.release = 21
}
def catalogResources = layout.buildDirectory.dir('generated/commandCatalog')
def catalog = tasks.register('generateCommandCatalog', JavaExec) {
    dependsOn catalogTool
    classpath = files(catalogTool.flatMap { it.destinationDirectory })
    mainClass = 'io.ruin.tools.GenerateCommandCatalog'
    def handler = file('src/main/java/io/ruin/network/incoming/handlers/CommandHandler.java')
    def output = catalogResources.map { it.file('command-catalog.tsv') }
    inputs.file(handler)
    outputs.file(output)
    args handler.absolutePath, output.get().asFile.absolutePath
}
processResources {
    dependsOn catalog
    from(catalogResources)
}
dependencies {
    testImplementation files(catalogTool.flatMap { it.destinationDirectory })
}
compileTestJava.dependsOn catalogTool

test {
    jvmArgs '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
}

tasks.register('combatItemAudit', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.ruin.tools.CombatItemAudit'
    jvmArgs '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
    workingDir = projectDir
    args new File(rootDir.parentFile, '.tools/combat-audit').absolutePath
}

tasks.register('homeMapAudit', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.ruin.tools.HomeMapAudit'
    jvmArgs '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
    workingDir = projectDir
    args file('../Cache').absolutePath, file('data').absolutePath,
        new File(rootDir.parentFile, '.tools/edgeville-map-audit').absolutePath
}

tasks.register('verifyHomeLayout', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.ruin.tools.HomeLayoutVerifier'
    jvmArgs '--add-exports=java.base/jdk.internal.vm=ALL-UNNAMED'
    workingDir = projectDir
    args file('../Cache').absolutePath, file('data').absolutePath,
        new File(rootDir.parentFile, '.tools/edgeville-map-audit').absolutePath
}
